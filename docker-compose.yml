services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: gr33t-dev
    container_name: gr33t-worker
    command: npm run dev:worker -- --ip 0.0.0.0
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - AUTH_MODE=local

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gr33t-dev
    container_name: gr33t-web
    command: npm run dev:web -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - WORKER_ORIGIN=http://worker:8787
    depends_on:
      - worker

volumes:
  worker_node_modules:
  web_node_modules:
