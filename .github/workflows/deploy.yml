name: deploy

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Runs on pull_request against attacker-controllable Terraform. It must NOT
  # have any cloud credentials in scope: `terraform plan` evaluates data
  # sources / providers at plan time, which is arbitrary code execution. PR
  # validation is limited to fmt + provider-only init + validate, none of which
  # need credentials. A credentialed plan is deferred to the maintainer-gated
  # apply job below (environment: production).
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend=false
      - run: terraform validate

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - name: Require a remote state backend
        run: |
          set -euo pipefail
          if ! grep -REq '^[[:space:]]*backend[[:space:]]+"' ./*.tf; then
            echo "::error::No remote Terraform backend is configured (backend.tf is commented out)."
            echo "Refusing to apply with ephemeral local state. Enable the R2 backend in infra/terraform/backend.tf, then re-run." >&2
            exit 1
          fi
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
      - name: Resource ids (copy into D1_DATABASE_ID / KV_NAMESPACE_ID / CARD_CACHE_KV_ID secrets)
        run: terraform output

  deploy:
    if: github.event_name != 'pull_request'
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: corepack enable

      - run: npm ci

      - run: npm run build

      - name: Render deploy wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          CARD_CACHE_KV_ID: ${{ secrets.CARD_CACHE_KV_ID }}
        run: infra/scripts/render-wrangler-config.sh worker/wrangler.deploy.toml

      - name: Put Worker secrets
        env:
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$COOKIE_SECRET" | npx wrangler secret put COOKIE_SECRET --config worker/wrangler.deploy.toml
          if [ -n "${GOOGLE_CLIENT_ID:-}" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --config worker/wrangler.deploy.toml
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --config worker/wrangler.deploy.toml
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply gr33t --remote --config worker/wrangler.deploy.toml

      - name: Deploy Worker
        env:
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${AUTH_MODE:-}" ]; then EXTRA="$EXTRA --var AUTH_MODE:${AUTH_MODE}"; fi
          if [ -n "${GOOGLE_REDIRECT_URI:-}" ]; then EXTRA="$EXTRA --var GOOGLE_REDIRECT_URI:${GOOGLE_REDIRECT_URI}"; fi
          npx wrangler deploy --config worker/wrangler.deploy.toml $EXTRA

      - name: Deploy Pages (SPA)
        env:
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
        run: |
          npx wrangler pages deploy web/dist \
            --project-name "${PAGES_PROJECT_NAME:-gr33t}" \
            --branch main
